name: bookmyshow-watch

on:
  schedule:
    # Hourly from 07:47 to 22:47 IST (02:17-17:17 UTC). GitHub can delay
    # scheduled runs, so off-the-hour minutes are used.
    - cron: "17 2-17 * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Only send a test alert on every channel you set up"
        type: boolean
        default: false

concurrency:
  group: bookmyshow-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # state.json remembers what was already open, so you get one alert
      # per opening instead of one every hour.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: bms-state-${{ github.run_id }}
          restore-keys: bms-state-

      - name: Check BookMyShow
        env:
          TEST_ALERT: ${{ inputs.test_alert && '1' || '0' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python notifier.py

      - name: Save state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: bms-state-${{ github.run_id }}
